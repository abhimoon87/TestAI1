name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly integration run — free data providers (yfinance/jugaad/nselib)
  # drift constantly; this is the early-warning signal for API breakage.
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.16,<0.17"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r scanner/requirements.txt
          pip install pytest pytest-cov
      # Offline unit suite (external APIs are mocked); integration tests are
      # deselected by pytest.ini and run only in the scheduled job below.
      # Gate: fail if overall coverage drops below 50% (currently ~53%).
      - run: >-
          python -m pytest
          --cov=scanner
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=50
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    # Live-network tests: weekly schedule or manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true # external free APIs are flaky; failures are signal, not gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r scanner/requirements.txt
          pip install pytest
      - run: python -m pytest -m integration -q
